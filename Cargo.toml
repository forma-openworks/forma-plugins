[workspace]
resolver = "3"
members = ["plugins/terms", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/forma-openworks/forma-plugins"

[workspace.dependencies]
forma-plugin-api = { git = "https://github.com/forma-openworks/forma-core", branch = "main" }
forma-plugins = { git = "https://github.com/forma-openworks/forma-core", branch = "main" }

# Модули плагинов — поменьше: они грузятся в каждую программу.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
